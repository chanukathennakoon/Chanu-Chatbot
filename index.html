<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Chatbot</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-wrapper">
    <header class="chat-header">💬 Chanu Chatbot</header>
    <div class="chat-box" id="chat-box"></div>
  
      <form id="chat-form" class="chat-form">
  <input type="file" id="file-input" style="display: none" />
  <label for="file-input" class="file-label">📎</label>
  <input type="text" id="user-input" placeholder="Ask me anything..." autocomplete="off" required />
  <button type="submit">➤</button>
  <button type="button" id="clear-btn">🗑️</button>
</form>
 </div>
  <script src="script.js"></script>
</body>
</html>
